<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AI 助手 · 大肥鱼的小站</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <button class="new-btn" id="newChat">＋ 新对话</button>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
        <input id="q" placeholder="搜索对话">
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <button class="me" id="meBtn">
        <div class="avatar" id="meAvatar">?</div>
        <div class="who">
          <div class="name"><span id="meName">未登录</span><span class="tag" id="meRole" hidden></span></div>
          <div class="role" id="meHint">点这里：自定义指令 / 成员</div>
        </div>
      </button>
    </div>
  </aside>

  <main id="main">
    <header class="top">
      <button class="burger" id="burger">☰</button>
      <button class="title" id="titleBtn">新对话</button>
      <div class="spacer"></div>
      <button class="model-pill" id="modelBtn">
        <span class="dot" id="connDot"></span>
        <span id="modelName">—</span>
        <span class="eff" id="effName">中</span>
        <span class="car">▾</span>
      </button>
      <button class="icon" id="menuBtn" title="更多">⋯</button>
    </header>

    <div class="scroll" id="scroll">
      <div class="empty" id="empty">
        <h1>今天想聊点什么？</h1>
        <p>问问题、写东西、看代码；也能发图问图、联网查资料。</p>
        <div class="chips">
          <button data-p="帮我把这段需求拆成可执行的任务清单">拆解需求</button>
          <button data-p="用通俗的话解释一下注意力机制">解释概念</button>
          <button data-p="写一段 Python 脚本，扫描目录下所有超过 100MB 的文件">写脚本</button>
          <button data-p="画一只在雨里打伞的橘猫，赛博朋克霓虹夜景" data-img="1">生成一张图</button>
        </div>
      </div>
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <div class="attach" id="attach"></div>
      <div class="caps" id="caps">
        <button type="button" class="cap" data-cap="image"><span class="ci">🖼️</span>生成图片</button>
        <button type="button" class="cap" data-cap="code"><span class="ci">🧑‍💻</span>编程模式</button>
        <button type="button" class="cap" data-cap="search"><span class="ci">🌐</span>联网搜索</button>
      </div>
      <form class="composer" id="composer">
        <div class="plus-wrap">
          <button type="button" class="icon" id="plusBtn" title="更多">＋</button>
          <div class="pop plus-pop" id="plusPop" hidden>
            <button type="button" class="opt" data-mode="upload">📎　上传图片</button>
          </div>
        </div>
        <textarea id="input" rows="1" placeholder="发消息…（Enter 发送，Shift+Enter 换行，可粘贴图片）"></textarea>
        <button type="submit" class="send" id="sendBtn" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </form>
      <div class="meter">
        <span class="ring" id="ring" title="上下文占用">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="7.5" fill="none" stroke="var(--line)" stroke-width="2.5"/>
            <circle id="ringArc" cx="10" cy="10" r="7.5" fill="none" stroke="var(--ok)" stroke-width="2.5"
              stroke-dasharray="47.12" stroke-dashoffset="47.12" stroke-linecap="round" transform="rotate(-90 10 10)"/>
          </svg>
        </span>
        <span class="num" id="ctxNum">0 / 400,000</span>
        <span class="arch" id="ctxArch" hidden></span>
        <span class="spacer"></span>
        <button type="button" class="handoff-btn" id="handoffBtn" title="把上文压成交接文档，之后只带文档继续">交接文档</button>
      </div>
    </div>
  </main>
</div>

<!-- 代码面板 -->
<aside id="codepane" hidden>
  <div class="code-head">
    <div class="tabs" id="codeTabs"></div>
    <div class="code-actions">
      <button id="codePreview" title="预览 HTML">▶</button>
      <button id="codeNew" title="新建文件">＋</button>
      <button id="codeDownload" title="下载当前文件">⤓</button>
      <button id="codeClose" title="关闭面板">×</button>
    </div>
  </div>
  <div class="code-meta"><span id="codeName">—</span><span id="codeStat"></span></div>
  <textarea id="codeArea" spellcheck="false" placeholder="这里会显示 GPT 写出的文件；也可以直接编辑。"></textarea>
  <iframe id="codeFrame" sandbox="allow-scripts allow-forms allow-modals" hidden title="预览"></iframe>
</aside>

<input type="file" id="fileInput" accept="image/*" multiple hidden>

<div class="pop" id="modelPop" hidden>
  <h4>模型</h4>
  <div id="modelList"></div>
  <div class="sep"></div>
  <div class="row"><span>推理强度</span><span id="popEff">中</span></div>
  <input type="range" id="effRange" min="0" max="2" step="1" value="1">
  <div class="ticks" id="effTicks"></div>
  <div class="hint" id="effHint"></div>
</div>

<div class="pop" id="menuPop" hidden>
  <button class="opt" id="renameBtn">重命名对话</button>
  <button class="opt" id="privateBtn">转为私人对话</button>
  <div class="sep"></div>
  <button class="opt" id="newPrivateBtn">新建私人对话</button>
  <button class="opt" id="newProjectBtn">新建项目</button>
</div>

<div class="pop" id="userPop" hidden>
  <button class="opt" id="insBtn">自定义指令</button>
  <button class="opt" id="usersBtn">成员管理</button>
  <button class="opt" id="cfgBtn">接口设置</button>
  <div class="sep"></div>
  <button class="opt" id="renameSelfBtn">改我的昵称</button>
  <button class="opt" id="logoutBtn" style="color:var(--danger)">退出登录</button>
</div>

<!-- 登录 -->
<div class="overlay" id="dlgLogin" hidden>
  <div class="card">
    <h2>进聊天室</h2>
    <p>填昵称和口令。昵称会显示在你发的每条消息上。</p>
    <label class="field">昵称<input id="loginName" maxlength="24" autocomplete="nickname" placeholder="比如：老王"></label>
    <label class="field">口令<input type="password" id="loginPass" autocomplete="current-password" placeholder="问站长要"></label>
    <div class="msg-err" id="loginErr"></div>
    <button class="primary" id="loginOk">进去</button>
  </div>
</div>

<!-- 项目 -->
<div class="overlay" id="dlgProject" hidden>
  <div class="card">
    <h2 id="projTitle">新建项目</h2>
    <p>项目是个文件夹，可以带背景指令；里面的对话都会自动带上它。</p>
    <label class="field">项目名称<input id="projName" placeholder="比如：网站 /ai/ 项目"></label>
    <label class="field">项目指令（背景 / 要求）<textarea id="projIns" rows="4" placeholder="这个项目是什么、有哪些约定……"></textarea></label>
    <div class="btn-row">
      <button class="ghost" style="flex:1" id="projCancel">取消</button>
      <button class="primary" style="flex:1" id="projSave">保存</button>
    </div>
    <button class="ghost" style="width:100%;margin-top:8px;color:var(--danger)" id="projDelete" hidden>删除这个项目</button>
  </div>
</div>

<!-- 自定义指令 -->
<div class="overlay" id="dlgIns" hidden>
  <div class="card">
    <h2>自定义指令</h2>
    <p>只对你自己生效，所有对话和项目都会带上。</p>
    <label class="field">你希望 GPT 怎么回复<textarea id="insStyle" rows="4" placeholder="比如：直接给结论；代码给完整可跑的；不确定就说不知道。"></textarea></label>
    <label class="field">关于我 / 背景事实<textarea id="insAbout" rows="4" placeholder="比如：我在做 Blender 插件；只用 Windows；项目在 A:\\Work。"></textarea></label>
    <div class="btn-row">
      <button class="ghost" style="flex:1" id="insCancel">取消</button>
      <button class="primary" style="flex:1" id="insSave">保存</button>
    </div>
  </div>
</div>

<!-- 成员 -->
<div class="overlay" id="dlgUsers" hidden>
  <div class="card wide">
    <h2>进来过的人</h2>
    <p>认不出的直接拉黑；私人对话只有创建者和管理员能看到。</p>
    <div class="members" id="userList"></div>
    <button class="ghost" style="width:100%;margin-top:12px" id="usersClose">关闭</button>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="dlgCfg" hidden>
  <div class="card">
    <h2>接口设置</h2>
    <p>一般不用改，只有后端换地址才需要动。</p>
    <label class="field">后端地址<input id="cfgBackend" placeholder="https://chat.example.com/ai-api"></label>
    <label class="field">模型（逗号分隔）<input id="cfgModels" placeholder="gpt-6.1-terra,gpt-6-luna"></label>
    <div class="btn-row">
      <button class="ghost" style="flex:1" id="cfgCancel">取消</button>
      <button class="primary" style="flex:1" id="cfgSave">保存</button>
    </div>
  </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
