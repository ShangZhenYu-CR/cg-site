<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 · 作品与闲聊</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b35;
    --text: #e6e8ec; --dim: #98a0ae; --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 64px 20px 140px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { color: var(--dim); margin: 0 0 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; margin: 24px 0;
  }
  .card b { color: var(--text); font-weight: 600; }

  /* 聊天浮窗 */
  #chatBtn {
    position: fixed; right: 20px; bottom: 20px; z-index: 40;
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #08101f; font-size: 24px; line-height: 1;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #chatPanel {
    position: fixed; right: 20px; bottom: 88px; z-index: 41;
    width: min(380px, calc(100vw - 40px)); height: min(520px, calc(100vh - 140px));
    display: none; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,.5);
  }
  #chatPanel.open { display: flex; }
  #chatHead {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  #chatHead span { color: var(--dim); font-weight: 400; font-size: 12px; }
  #chatLog { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #08101f; }
  .msg.bot { align-self: flex-start; background: #222733; }
  .msg.err { align-self: center; color: #ff8f8f; font-size: 13px; }
  #chatForm { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  #chatInput {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px;
    background: #10131a; color: var(--text); padding: 9px 12px; font: inherit; max-height: 96px;
  }
  #chatInput:focus { outline: 1px solid var(--accent); }
  #chatSend {
    border: none; border-radius: 10px; padding: 0 16px; cursor: pointer;
    background: var(--accent); color: #08101f; font-weight: 600;
  }
  #chatSend:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1>大肥鱼</h1>
  <p>CG 角色 / 场景 / 资产。资产库预览整理中。</p>

  <div class="card">
    <b>关于</b><br>
    这里放你的简介、作品方向、常用工具。两三句就够。
  </div>

  <div class="card">
    <b>约稿与合作</b><br>
    邮箱 / 站内联系方式放在这里。报价一律走这里，别在聊天里定。
  </div>

  <p>右下角可以聊两句，她会回答关于作品和工具的问题。</p>
</main>

<button id="chatBtn" aria-label="打开聊天">💬</button>
<div id="chatPanel" role="dialog" aria-label="聊天">
  <div id="chatHead">大肥鱼 <span>在线</span></div>
  <div id="chatLog"></div>
  <form id="chatForm">
    <textarea id="chatInput" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
    <button id="chatSend" type="submit">发送</button>
  </form>
</div>

<script>
// 后端地址：阿里云函数计算（已部署）
const API = 'https://site-chat-hkinbknrkv.cn-hangzhou.fcapp.run';

const panel = document.getElementById('chatPanel');
const log = document.getElementById('chatLog');
const form = document.getElementById('chatForm');
const input = document.getElementById('chatInput');
const sendBtn = document.getElementById('chatSend');
const history = [];

document.getElementById('chatBtn').addEventListener('click', () => {
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    if (log.childElementCount === 0) addMsg('bot', '在呢 随便问');
    input.focus();
  }
});

function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;

  input.value = '';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  sendBtn.disabled = true;
  const bubble = addMsg('bot', '…');
  let answer = '';

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history.slice(-20) }),
    });

    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    // 非流式后端（阿里云 FC）返回 JSON，直接整段填进去
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('text/event-stream')) {
      const data = await res.json();
      answer = (data.reply || '').trim();
      bubble.textContent = answer || '（没说话，再问一次？）';
      if (answer) history.push({ role: 'assistant', content: answer });
      log.scrollTop = log.scrollHeight;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      // 按行拆 SSE
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const delta = JSON.parse(data)?.choices?.[0]?.delta?.content;
          if (delta) { answer += delta; bubble.textContent = answer; log.scrollTop = log.scrollHeight; }
        } catch { /* 忽略心跳等非 JSON 行 */ }
      }
    }

    if (!answer) bubble.textContent = '（没说话，再问一次？）';
    else history.push({ role: 'assistant', content: answer });
  } catch (err) {
    bubble.remove();
    addMsg('err', '连接失败：' + err.message);
    history.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
