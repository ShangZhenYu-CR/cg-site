<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大肥鱼的聊天室</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b35;
    --text: #e6e8ec; --dim: #98a0ae; --accent: #6ea8fe; --bot: #232a36;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }

  /* 登录 */
  #login {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #login.hide { display: none; }
  .login-box { width: min(360px, 100%); }
  .login-box h1 { font-size: 32px; margin: 0 0 6px; }
  .login-box p { color: var(--dim); margin: 0 0 24px; font-size: 14px; }
  .login-box input {
    width: 100%; padding: 12px 14px; border-radius: 10px; font: inherit;
    background: #10131a; border: 1px solid var(--line); color: var(--text); margin-bottom: 12px;
  }
  .login-box input:focus { outline: 1px solid var(--accent); }
  .login-box button {
    width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #08101f; font: inherit; font-weight: 600;
  }

  /* 顶栏 */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none;
    background: var(--panel);
  }
  header b { font-size: 15px; }
  header .me { color: var(--dim); font-size: 13px; cursor: pointer; }
  header .me:hover { color: var(--text); }

  /* 消息区 */
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-direction: column; max-width: 100%; }
  .row.mine { align-items: flex-end; }
  .meta { font-size: 12px; color: var(--dim); margin-bottom: 3px; display: flex; gap: 6px; align-items: baseline; }
  .bubble {
    padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word;
    background: var(--bot); max-width: min(78%, 620px); width: fit-content;
  }
  .row.mine .bubble { background: var(--accent); color: #08101f; }
  .row.bot .bubble { background: #1d2735; border: 1px solid #2c3a4f; }
  .row.bot .meta { color: var(--accent); }
  .sys { align-self: center; color: #ff9c9c; font-size: 12px; }

  /* 输入区 */
  footer { flex: none; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); display: flex; gap: 8px; }
  #input {
    flex: 1; resize: none; max-height: 110px; padding: 10px 12px; border-radius: 10px;
    background: #10131a; border: 1px solid var(--line); color: var(--text); font: inherit;
  }
  #input:focus { outline: 1px solid var(--accent); }
  #send {
    border: none; border-radius: 10px; padding: 0 18px; cursor: pointer;
    background: var(--accent); color: #08101f; font-weight: 600;
  }
  #send:disabled { opacity: .45; cursor: default; }

  .typing { color: var(--dim); font-size: 12px; padding: 0 16px 8px; }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>大肥鱼的聊天室</h1>
    <p>起个名字就能进，大家都在同一个房间里。</p>
    <input id="nickInput" maxlength="16" placeholder="你的昵称" autocomplete="off">
    <button id="enterBtn">进去</button>
  </div>
</div>

<header>
  <b>大肥鱼的聊天室</b>
  <span class="me" id="meBtn">—</span>
</header>

<div id="log"></div>
<div class="typing" id="typing"></div>

<footer>
  <textarea id="input" rows="1" placeholder="说点什么…（叫「大肥鱼」她会回你）" autocomplete="off"></textarea>
  <button id="send">发送</button>
</footer>

<script>
const API = 'https://site-chat-hkinbknrkv.cn-hangzhou.fcapp.run';
const POLL_MS = 3000;

let nick = localStorage.getItem('room_nick') || '';
let offset = 0;
let date = '';
let polling = false;
let seen = new Set();

const logEl = document.getElementById('log');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const typingEl = document.getElementById('typing');
const loginEl = document.getElementById('login');
const nickInput = document.getElementById('nickInput');
const meBtn = document.getElementById('meBtn');

/* ---------- 登录 ---------- */
function enter(name) {
  nick = name;
  localStorage.setItem('room_nick', name);
  loginEl.classList.add('hide');
  meBtn.textContent = nick + ' · 换名';
  start();
}
document.getElementById('enterBtn').addEventListener('click', () => {
  const v = nickInput.value.trim();
  if (v) enter(v);
});
nickInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('enterBtn').click();
});
meBtn.addEventListener('click', () => {
  loginEl.classList.remove('hide');
  nickInput.value = nick;
  nickInput.focus();
});

/* ---------- 渲染 ---------- */
function timeStr(t) {
  const d = new Date(t);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function addMessage(m) {
  if (!m || seen.has(m.id)) return;
  seen.add(m.id);

  const row = document.createElement('div');
  row.className = 'row' + (m.nick === nick ? ' mine' : '') + (m.bot ? ' bot' : '');

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = m.nick + ' · ' + timeStr(m.t);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = m.text;

  row.append(meta, bubble);
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

function addSystem(text) {
  const el = document.createElement('div');
  el.className = 'sys';
  el.textContent = text;
  logEl.appendChild(el);
}

/* ---------- 轮询 ---------- */
async function post(body) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function poll() {
  if (polling || !nick) return;
  polling = true;
  try {
    const data = await post({ action: 'log', date, offset });
    if (data.rotated || (data.date && date && data.date !== date)) {
      // 跨天了，重来
      logEl.innerHTML = '';
      seen = new Set();
      offset = 0;
      date = data.date;
      return;
    }
    date = data.date;
    offset = data.offset;
    (data.messages || []).forEach(addMessage);
  } catch (e) {
    // 静默失败，下一轮再试
  } finally {
    polling = false;
  }
}

function start() {
  logEl.innerHTML = '';
  seen = new Set();
  offset = 0;
  date = '';
  poll();
  setInterval(poll, POLL_MS);
}

/* ---------- 发送 ---------- */
async function send() {
  const text = inputEl.value.trim();
  if (!text || !nick) return;

  inputEl.value = '';
  sendBtn.disabled = true;
  typingEl.textContent = '她可能在打字…';

  try {
    const data = await post({ action: 'send', nick, text });
    (data.messages || []).forEach(addMessage);
    logEl.scrollTop = logEl.scrollHeight;
  } catch (e) {
    addSystem('发送失败：' + e.message);
  } finally {
    sendBtn.disabled = false;
    typingEl.textContent = '';
    inputEl.focus();
    poll();
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

/* ---------- 启动 ---------- */
if (nick) {
  loginEl.classList.add('hide');
  meBtn.textContent = nick + ' · 换名';
  start();
}
</script>
</body>
</html>
