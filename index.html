<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b35;
    --text: #e6e8ec; --dim: #98a0ae; --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { width: min(520px, 100%); text-align: left; }
  h1 { font-size: 44px; margin: 0 0 8px; letter-spacing: .02em; }
  .lead { color: var(--text); opacity: .85; font-size: 16px; margin: 0 0 6px; }
  .hint { color: var(--dim); font-size: 14px; margin: 0 0 36px; }

  .enter {
    display: block; text-align: center; text-decoration: none;
    padding: 15px 20px; border-radius: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #08101f; margin-bottom: 12px;
  }
  .enter:hover { filter: brightness(1.06); }

  .row { display: flex; gap: 10px; }
  .row a, .row button {
    flex: 1; text-align: center; text-decoration: none; cursor: pointer;
    padding: 11px 12px; border-radius: 10px; font: inherit; font-size: 14px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
  }
  .row a:hover, .row button:hover { border-color: var(--accent); color: var(--accent); }

  footer { margin-top: 40px; color: #5f6b7d; font-size: 12px; line-height: 1.8; }
  footer a { color: #5f6b7d; }
</style>
</head>
<body>
<main>
  <h1>大肥鱼</h1>
  <p class="lead">CG 角色 · 场景 · 资产</p>
  <p class="hint">她在聊天室里住着，进来随便聊。</p>

  <a class="enter" href="https://chat.coldrain-aichat.com">进入聊天室 →</a>

  <div class="row">
    <a href="/code/">工具箱</a>
    <a href="/chat.html">设置（需口令）</a>
  </div>

  <footer>
    桌宠形象：大肥鱼（上善无形 / ZipZipPipe / 氵六青，CC BY-NC-SA 4.0）
  </footer>
</main>
</body>
</html>
